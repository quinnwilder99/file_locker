[package]
name = "vault-core"
description = "Vault format, key management and file/name encryption for file_locker"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11"
aes-siv = "0.8"
argon2 = "0.6"
base64 = "0.23"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
